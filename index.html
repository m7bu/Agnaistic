<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Personas" />
  <meta id="meta-theme-color" name="theme-color" content="#000000" />
  <title>AI Personas Studio</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              gray: '#8E8E93',
              lightBg: '#F2F2F7',
              lightCard: '#FFFFFF',
              lightBubble: '#E9E9EB',
              darkBg: '#000000',
              darkCard: '#1C1C1E',
              darkBubble: '#2C2C2E',
              darkBorder: '#2C2C2E',
              lightBorder: '#E5E5EA'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Helvetica Neue', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="manifest" id="manifest-placeholder" />

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top { padding-top: max(14px, var(--sat)); }
    .safe-bottom { padding-bottom: max(14px, var(--sab)); }

    /* Fix Tailwind display override clashes */
    .app-hidden {
      display: none !important;
    }
    .app-flex {
      display: flex !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(142, 142, 147, 0.5); }

    /* Typing pulse */
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
      40% { transform: scale(1.05); opacity: 1; }
    }
    .dot-1 { animation: dotPulse 1.3s infinite ease-in-out; }
    .dot-2 { animation: dotPulse 1.3s infinite ease-in-out 0.2s; }
    .dot-3 { animation: dotPulse 1.3s infinite ease-in-out 0.4s; }

    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="h-full bg-ios-lightBg dark:bg-ios-darkBg text-neutral-900 dark:text-neutral-100 font-sans antialiased overflow-hidden transition-colors duration-200">

  <!-- ==================== MAIN APP CONTAINER ==================== -->
  <div id="app" class="h-[100dvh] flex flex-col w-full max-w-lg mx-auto relative overflow-hidden bg-ios-lightBg dark:bg-ios-darkBg sm:border-x sm:border-ios-lightBorder sm:dark:border-ios-darkBorder shadow-2xl">
    
    <!-- ==================== VIEW 1: BOT DIRECTORY ==================== -->
    <section id="view-bots" class="flex-1 flex flex-col h-full w-full overflow-hidden">
      <!-- Navbar -->
      <header class="safe-top px-4 pb-3 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/90 dark:bg-ios-darkBg/90 backdrop-blur-xl z-10 sticky top-0">
        <div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-ios-blue">Studio</span>
          <h1 class="text-2xl font-black tracking-tight">Characters</h1>
        </div>
        
        <div class="flex items-center gap-2">
          <!-- Theme Toggle -->
          <button type="button" id="btn-toggle-theme" aria-label="Toggle Theme" class="p-2.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <span id="theme-icon-sun" class="app-hidden text-sm leading-none">☀️</span>
            <span id="theme-icon-moon" class="text-sm leading-none">🌙</span>
          </button>

          <!-- Settings -->
          <button type="button" id="btn-open-settings" aria-label="Settings" class="p-2.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>

          <!-- Create Button -->
          <button type="button" id="btn-create-bot" class="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-ios-blue text-white text-xs font-bold active:scale-95 transition-transform shadow-sm cursor-pointer">
            <svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span>New</span>
          </button>
        </div>
      </header>

      <!-- Search Bar -->
      <div class="px-4 py-2.5">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 absolute left-3.5 text-ios-gray pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="input-search-bots" placeholder="Search characters..." class="w-full bg-neutral-200/70 dark:bg-neutral-800/70 text-sm placeholder-ios-gray rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-ios-blue transition-all" />
        </div>
      </div>

      <!-- Character List -->
      <main id="bot-list-container" class="flex-1 overflow-y-auto px-4 py-2 space-y-2.5 pb-24">
        <!-- Rendered by JavaScript -->
      </main>
    </section>

    <!-- ==================== VIEW 2: CHAT INTERFACE ==================== -->
    <section id="view-chat" class="app-hidden flex-1 flex flex-col h-full w-full overflow-hidden bg-white dark:bg-black">
      <!-- Chat Navbar -->
      <header class="safe-top px-3 pb-2.5 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl z-20">
        <button type="button" id="btn-chat-back" class="flex items-center text-ios-blue font-semibold active:opacity-50 transition-opacity pr-2 py-1 cursor-pointer">
          <svg class="w-5 h-5 -ml-1 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-xs font-bold">Back</span>
        </button>

        <!-- Bot Identity -->
        <div class="flex items-center gap-2 max-w-[55%] truncate cursor-pointer select-none" id="btn-chat-header-info">
          <div id="chat-header-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-neutral-200 dark:bg-neutral-800 flex-shrink-0 flex items-center justify-center font-bold text-xs text-white"></div>
          <div class="truncate text-left">
            <h2 id="chat-header-name" class="text-xs font-bold truncate leading-tight">Bot</h2>
            <p id="chat-header-model" class="text-[10px] text-ios-gray truncate font-mono">gpt-4o-mini</p>
          </div>
        </div>

        <!-- Chat Options -->
        <div class="relative">
          <button type="button" id="btn-chat-options" aria-label="Menu" class="p-1.5 text-ios-blue active:opacity-50 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
            </svg>
          </button>
          
          <div id="chat-dropdown-menu" class="app-hidden absolute right-0 mt-1.5 w-44 rounded-2xl bg-white/95 dark:bg-neutral-900/95 backdrop-blur-xl shadow-2xl border border-neutral-200 dark:border-neutral-800 py-1 z-50 text-xs">
            <button type="button" id="menu-edit-bot" class="w-full text-left px-3.5 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 flex items-center gap-2 cursor-pointer font-medium">
              <span>✏️ Edit Persona</span>
            </button>
            <button type="button" id="menu-clear-chat" class="w-full text-left px-3.5 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-ios-red flex items-center gap-2 border-t border-neutral-100 dark:border-neutral-800 cursor-pointer font-medium">
              <span>🗑️ Clear History</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Messages Stream -->
      <main id="chat-messages-container" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 select-text">
        <!-- Injected dynamically -->
      </main>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="app-hidden px-4 py-1.5 flex items-center gap-2 text-xs text-ios-gray">
        <div class="px-3 py-2 rounded-2xl bg-ios-lightBubble dark:bg-ios-darkBubble inline-flex items-center gap-1 shadow-sm">
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-1"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-2"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-3"></span>
        </div>
      </div>

      <!-- Bottom Chat Composer -->
      <footer class="safe-bottom p-2.5 bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl border-t border-ios-lightBorder dark:border-ios-darkBorder z-20">
        <form id="chat-form" class="flex items-end gap-2 max-w-full">
          <div class="flex-1 bg-white dark:bg-neutral-900 border border-ios-lightBorder dark:border-ios-darkBorder rounded-2xl flex items-center px-3.5 py-1.5 focus-within:ring-2 focus-within:ring-ios-blue transition-all">
            <textarea id="chat-textarea" rows="1" placeholder="Type a message..." class="w-full bg-transparent text-sm resize-none focus:outline-none max-h-32 leading-5 text-neutral-900 dark:text-neutral-100 placeholder-ios-gray"></textarea>
          </div>
          
          <button type="submit" id="btn-send-message" disabled class="p-2.5 rounded-full bg-ios-blue text-white disabled:opacity-40 disabled:pointer-events-none active:scale-95 transition-all flex-shrink-0 cursor-pointer shadow-md">
            <svg id="icon-send" class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            <svg id="icon-stop" class="w-4 h-4 app-hidden fill-current" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- ==================== MODAL: PERSONA EDITOR ==================== -->
    <div id="modal-bot-editor" class="app-hidden fixed inset-0 z-50 items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-lg bg-ios-lightBg dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
        
        <div class="px-4 py-3 border-b border-ios-lightBorder dark:border-ios-darkBorder flex items-center justify-between bg-white dark:bg-neutral-900 sticky top-0 z-10">
          <button type="button" id="btn-cancel-bot-edit" class="text-xs font-semibold text-ios-blue cursor-pointer py-1 px-2">Cancel</button>
          <h3 id="modal-bot-title" class="text-sm font-bold">New Character</h3>
          <button type="button" id="btn-save-bot" class="text-xs font-bold text-ios-blue cursor-pointer py-1 px-2">Save</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Avatar Customization -->
          <div class="flex flex-col items-center justify-center py-1">
            <input type="file" id="bot-avatar-file-input" accept="image/*" class="hidden" />
            <div class="relative cursor-pointer group" id="avatar-picker-trigger" title="Upload custom photo">
              <div id="bot-avatar-preview" class="w-16 h-16 rounded-full bg-gradient-to-tr from-ios-blue to-purple-600 text-white flex items-center justify-center font-bold text-2xl shadow-md overflow-hidden ring-4 ring-white dark:ring-neutral-800">
                <span>🤖</span>
              </div>
              <div class="absolute bottom-0 right-0 bg-neutral-900 text-white rounded-full p-1 shadow-md border border-white dark:border-neutral-700">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              </div>
            </div>
            <div class="flex items-center gap-2 mt-2">
              <button type="button" id="btn-choose-photo" class="text-[11px] text-ios-blue font-bold cursor-pointer">Choose Photo</button>
              <span class="text-ios-gray text-xs">•</span>
              <button type="button" id="btn-pick-emoji" class="text-[11px] text-ios-blue font-bold cursor-pointer">Set Emoji</button>
            </div>
          </div>

          <!-- Name & Tagline Inputs -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl overflow-hidden border border-neutral-200 dark:border-neutral-700 divide-y divide-neutral-100 dark:divide-neutral-700">
            <div class="p-3">
              <label class="block text-[10px] font-bold text-ios-gray uppercase tracking-wider mb-1">Character Name</label>
              <input type="text" id="bot-name-input" placeholder="e.g. Socrates, Nova, Cyber Samurai" class="w-full bg-transparent text-sm focus:outline-none text-neutral-900 dark:text-neutral-100" />
            </div>
            <div class="p-3">
              <label class="block text-[10px] font-bold text-ios-gray uppercase tracking-wider mb-1">Tagline / Role</label>
              <input type="text" id="bot-tagline-input" placeholder="e.g. Philosophical Guide &amp; Teacher" class="w-full bg-transparent text-sm focus:outline-none text-neutral-900 dark:text-neutral-100" />
            </div>
          </div>

          <!-- System Instructions -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3 border border-neutral-200 dark:border-neutral-700">
            <label class="block text-[10px] font-bold text-ios-gray uppercase tracking-wider mb-1">System Instructions (Personality)</label>
            <textarea id="bot-prompt-input" rows="4" placeholder="Describe how this character speaks, their background, knowledge, and demeanor..." class="w-full bg-transparent text-sm resize-none focus:outline-none text-neutral-900 dark:text-neutral-100 placeholder-ios-gray"></textarea>
          </div>

          <!-- Quick Archetypes -->
          <div class="space-y-1.5">
            <span class="text-[10px] font-bold text-ios-gray uppercase tracking-wider ml-1">Starter Archetypes</span>
            <div class="flex gap-2 flex-wrap">
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 font-medium active:scale-95 transition-transform cursor-pointer" data-avatar="🏛️" data-name="Marcus Aurelius" data-tagline="Stoic Emperor &amp; Sage" data-prompt="You are Marcus Aurelius, Roman Emperor and Stoic author of Meditations. Offer stoic wisdom and tranquil perspective." data-temp="0.6">🏛️ Stoic Sage</button>
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 font-medium active:scale-95 transition-transform cursor-pointer" data-avatar="💻" data-name="Nova Code" data-tagline="Senior Software Architect" data-prompt="You are Nova, an elite senior software architect. Provide clean, modular code and crisp technical solutions." data-temp="0.2">💻 Tech Architect</button>
              <button type="button" class="btn-quick-archetype text-xs px-3 py-1.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 font-medium active:scale-95 transition-transform cursor-pointer" data-avatar="✨" data-name="Lyra" data-tagline="Creative Sci-Fi Novelist" data-prompt="You are Lyra, a world-building sci-fi novelist. Write vivid, imaginative, and evocative scenes." data-temp="1.1">✨ Sci-Fi Author</button>
            </div>
          </div>

          <!-- Model & Parameters -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3 border border-neutral-200 dark:border-neutral-700 space-y-3">
            <div>
              <label class="block text-[10px] font-bold text-ios-gray uppercase tracking-wider mb-1">Model Identifier</label>
              <input type="text" id="bot-model-input" list="model-suggestions" placeholder="gpt-4o-mini" class="w-full bg-neutral-100 dark:bg-neutral-700 text-sm rounded-xl px-3 py-2 focus:outline-none font-mono" />
              <datalist id="model-suggestions">
                <option value="gpt-4o-mini">GPT-4o Mini</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                <option value="deepseek-chat">DeepSeek Chat</option>
              </datalist>
            </div>

            <!-- Temperature Slider -->
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="text-[10px] font-bold text-ios-gray uppercase tracking-wider">Creativity (Temperature)</span>
                <span id="temp-val-display" class="font-bold text-ios-blue font-mono">0.7</span>
              </div>
              <input type="range" id="bot-temp-slider" min="0.0" max="2.0" step="0.1" value="0.7" class="w-full accent-ios-blue cursor-pointer" />
            </div>
          </div>

          <!-- Delete Bot Action -->
          <div id="delete-bot-action-container" class="app-hidden pt-1">
            <button type="button" id="btn-delete-bot" class="w-full py-2.5 rounded-2xl text-ios-red font-bold bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 active:opacity-70 text-xs cursor-pointer">
              Delete Character
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== MODAL: SETTINGS ==================== -->
    <div id="modal-settings" class="app-hidden fixed inset-0 z-50 items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-lg bg-ios-lightBg dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
        
        <div class="px-4 py-3 border-b border-ios-lightBorder dark:border-ios-darkBorder flex items-center justify-between bg-white dark:bg-neutral-900">
          <h3 class="text-sm font-bold">Settings</h3>
          <button type="button" id="btn-close-settings" class="text-xs font-bold text-ios-blue cursor-pointer py-1 px-2">Done</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
          <!-- API Configuration -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3.5 border border-neutral-200 dark:border-neutral-700 space-y-3">
            <div class="flex items-center justify-between">
              <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider">OpenAI API Key</label>
              <span class="text-[10px] text-ios-green font-semibold">Saved Locally</span>
            </div>
            <div class="relative">
              <input type="password" id="input-api-key" placeholder="sk-..." class="w-full bg-neutral-100 dark:bg-neutral-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue font-mono pr-10" />
              <button type="button" id="btn-toggle-key-visibility" class="absolute right-3 top-2 text-ios-gray text-xs cursor-pointer">👁️</button>
            </div>

            <div>
              <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider block mb-1">API Base URL (Optional)</label>
              <input type="text" id="input-api-base" placeholder="https://api.openai.com/v1" class="w-full bg-neutral-100 dark:bg-neutral-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue font-mono" />
            </div>
          </div>

          <!-- Backup & Data Export -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl p-3.5 border border-neutral-200 dark:border-neutral-700 space-y-2.5">
            <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider block">Backup &amp; Restore</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btn-export-backup" class="py-2 px-3 rounded-xl bg-neutral-100 dark:bg-neutral-700 font-bold text-neutral-800 dark:text-neutral-200 active:scale-95 text-[11px] transition-transform cursor-pointer">
                📤 Export Backup
              </button>
              <button type="button" id="btn-import-backup-trigger" class="py-2 px-3 rounded-xl bg-neutral-100 dark:bg-neutral-700 font-bold text-neutral-800 dark:text-neutral-200 active:scale-95 text-[11px] transition-transform cursor-pointer">
                📥 Import Backup
              </button>
              <input type="file" id="input-import-backup" accept=".json" class="hidden" />
            </div>
          </div>

          <!-- Factory Reset -->
          <div class="pt-2">
            <button type="button" id="btn-reset-all-data" class="w-full py-2.5 text-xs font-bold text-ios-red bg-red-100/60 dark:bg-red-950/40 rounded-2xl border border-red-200 dark:border-red-900 cursor-pointer active:opacity-70">
              Factory Reset (Erase All Personas)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== TOAST NOTIFICATION ==================== -->
    <div id="toast" class="pointer-events-none fixed top-4 inset-x-0 mx-auto max-w-xs z-50 transform -translate-y-16 opacity-0 transition-all duration-300 flex items-center justify-center">
      <div class="bg-neutral-900/95 dark:bg-white/95 text-white dark:text-neutral-900 text-xs font-bold px-4 py-2 rounded-full shadow-2xl backdrop-blur-md">
        <span id="toast-message">Notification</span>
      </div>
    </div>

  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    const STORAGE_KEY_BOTS = 'aistudio_bots_v4';
    const STORAGE_KEY_CHATS = 'aistudio_chats_v4';
    const STORAGE_KEY_SETTINGS = 'aistudio_settings_v4';

    const DEFAULT_BOTS = [
      {
        id: 'bot-socrates',
        name: 'Socrates',
        tagline: 'Father of Classical Philosophy',
        avatar: '🏛️',
        systemPrompt: 'You are Socrates of Athens. Use the Socratic method by asking probing, insightful, thought-provoking questions that guide the user toward truth and self-examination.',
        model: 'gpt-4o-mini',
        temperature: 0.7,
        createdAt: Date.now() - 300000
      },
      {
        id: 'bot-aria-cyberpunk',
        name: 'Aria Kane',
        tagline: 'Cyberpunk Netrunner (Neo-Tokyo 2089)',
        avatar: '⚡',
        systemPrompt: 'You are Aria Kane, a razor-sharp cyberpunk netrunner in Neo-Tokyo. Speak with gritty tech slang, sharp wit, and vivid futuristic metaphors.',
        model: 'gpt-4o-mini',
        temperature: 0.9,
        createdAt: Date.now() - 200000
      },
      {
        id: 'bot-chef-remy',
        name: 'Chef Alexandre',
        tagline: 'Michelin Star Culinary Mentor',
        avatar: '👨‍🍳',
        systemPrompt: 'You are Chef Alexandre, an enthusiastic master chef. Share culinary wisdom, precision cooking techniques, and mouthwatering recipes.',
        model: 'gpt-4o-mini',
        temperature: 0.6,
        createdAt: Date.now() - 100000
      }
    ];

    let state = {
      bots: [],
      chats: {},
      activeBotId: null,
      settings: {
        apiKey: '',
        apiBase: 'https://api.openai.com/v1',
        theme: 'dark'
      },
      isStreaming: false,
      editingBotId: null,
      tempAvatar: '🤖'
    };

    let activeAbortController = null;

    /* ==================== DISPLAY UTILS ==================== */
    function show(el) {
      if (typeof el === 'string') el = document.getElementById(el);
      if (el) {
        el.classList.remove('app-hidden');
        el.classList.add('app-flex');
      }
    }

    function hide(el) {
      if (typeof el === 'string') el = document.getElementById(el);
      if (el) {
        el.classList.remove('app-flex');
        el.classList.add('app-hidden');
      }
    }

    /* ==================== INIT ==================== */
    function initApp() {
      loadState();
      applyTheme();
      setupPWA();
      setupEventListeners();
      renderBotList();
    }

    function loadState() {
      try {
        const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
        if (savedSettings) state.settings = { ...state.settings, ...JSON.parse(savedSettings) };

        const savedBots = localStorage.getItem(STORAGE_KEY_BOTS);
        state.bots = savedBots ? JSON.parse(savedBots) : DEFAULT_BOTS;

        const savedChats = localStorage.getItem(STORAGE_KEY_CHATS);
        state.chats = savedChats ? JSON.parse(savedChats) : {};

        if (state.bots.length > 0 && Object.keys(state.chats).length === 0) {
          state.chats['bot-socrates'] = [
            { id: 'init-1', role: 'assistant', content: 'Greetings! What philosophical question shall we examine together today?', timestamp: Date.now() }
          ];
          saveChats();
        }
      } catch (err) {
        console.error('Storage error:', err);
      }
    }

    function saveBots() { localStorage.setItem(STORAGE_KEY_BOTS, JSON.stringify(state.bots)); }
    function saveChats() { localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(state.chats)); }
    function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(state.settings)); }

    /* ==================== THEME ==================== */
    function applyTheme() {
      const html = document.documentElement;
      const metaTheme = document.getElementById('meta-theme-color');
      const sunIcon = document.getElementById('theme-icon-sun');
      const moonIcon = document.getElementById('theme-icon-moon');

      if (state.settings.theme === 'dark') {
        html.classList.add('dark');
        if (metaTheme) metaTheme.setAttribute('content', '#000000');
        sunIcon.classList.remove('app-hidden');
        moonIcon.classList.add('app-hidden');
      } else {
        html.classList.remove('dark');
        if (metaTheme) metaTheme.setAttribute('content', '#F2F2F7');
        sunIcon.classList.add('app-hidden');
        moonIcon.classList.remove('app-hidden');
      }
    }

    function toggleTheme() {
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      saveSettings();
      applyTheme();
      showToast(state.settings.theme === 'dark' ? 'Dark theme enabled' : 'Light theme enabled');
    }

    function setupPWA() {
      const manifest = {
        name: 'AI Personas Studio',
        short_name: 'Personas',
        start_url: './',
        display: 'standalone',
        background_color: '#000000',
        theme_color: '#007AFF'
      };
      const manifestStr = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.getElementById('manifest-placeholder').setAttribute('href', manifestStr);
    }

    /* ==================== NAVIGATION ==================== */
    function switchView(viewName) {
      if (viewName === 'chat') {
        hide('view-bots');
        show('view-chat');
        renderActiveChat();
      } else {
        hide('view-chat');
        show('view-bots');
        state.activeBotId = null;
        renderBotList();
      }
    }

    /* ==================== CHARACTER DIRECTORY ==================== */
    function renderBotList(filterText = '') {
      const container = document.getElementById('bot-list-container');
      const search = (filterText || '').toLowerCase().trim();

      const filteredBots = state.bots.filter(b => 
        b.name.toLowerCase().includes(search) || 
        (b.tagline && b.tagline.toLowerCase().includes(search))
      );

      if (filteredBots.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 text-center text-ios-gray">
            <span class="text-4xl mb-2">🎭</span>
            <p class="font-bold text-sm">No characters found</p>
            <p class="text-xs mt-1">Tap "+ New" above to create one.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredBots.map(bot => {
        const history = state.chats[bot.id] || [];
        const lastMsg = history.length > 0 ? history[history.length - 1].content : (bot.tagline || 'Tap to start conversation');
        const isPhoto = bot.avatar && bot.avatar.startsWith('data:image');

        const avatarHTML = isPhoto
          ? `<img src="${bot.avatar}" alt="${escapeHtml(bot.name)}" class="w-full h-full object-cover rounded-full" />`
          : `<span>${bot.avatar || '🤖'}</span>`;

        return `
          <div class="bot-card group flex items-center gap-3.5 p-3 rounded-2xl bg-white dark:bg-ios-darkCard border border-neutral-200/80 dark:border-ios-darkBorder shadow-sm active:scale-[0.98] transition-all cursor-pointer" data-id="${bot.id}">
            <div class="w-11 h-11 rounded-full flex-shrink-0 bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-lg shadow-inner overflow-hidden border border-neutral-200 dark:border-neutral-700 pointer-events-none">
              ${avatarHTML}
            </div>
            <div class="flex-1 min-w-0 pointer-events-none">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold truncate">${escapeHtml(bot.name)}</h3>
                <span class="text-[10px] text-ios-gray font-mono">${escapeHtml(bot.model || 'gpt-4o-mini')}</span>
              </div>
              <p class="text-xs text-ios-gray truncate mt-0.5">${escapeHtml(lastMsg)}</p>
            </div>
            <svg class="w-4 h-4 text-neutral-400 dark:text-neutral-600 flex-shrink-0 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        `;
      }).join('');
    }

    function openBotChat(botId) {
      state.activeBotId = botId;
      if (!state.chats[botId]) state.chats[botId] = [];
      switchView('chat');
    }

    /* ==================== CHAT VIEW ==================== */
    function renderActiveChat() {
      const bot = state.bots.find(b => b.id === state.activeBotId);
      if (!bot) return switchView('list');

      document.getElementById('chat-header-name').textContent = bot.name;
      document.getElementById('chat-header-model').textContent = `${bot.model || 'gpt-4o-mini'} • Temp ${bot.temperature ?? 0.7}`;

      const avatarContainer = document.getElementById('chat-header-avatar');
      if (bot.avatar && bot.avatar.startsWith('data:image')) {
        avatarContainer.innerHTML = `<img src="${bot.avatar}" class="w-full h-full object-cover" />`;
      } else {
        avatarContainer.innerHTML = `<span>${bot.avatar || '🤖'}</span>`;
      }

      const container = document.getElementById('chat-messages-container');
      const messages = state.chats[bot.id] || [];

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-center text-ios-gray px-6">
            <div class="w-16 h-16 rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-3xl mb-3 overflow-hidden shadow-inner border border-neutral-200 dark:border-neutral-700">
              ${bot.avatar && bot.avatar.startsWith('data:image') ? `<img src="${bot.avatar}" class="w-full h-full object-cover" />` : (bot.avatar || '🤖')}
            </div>
            <h4 class="font-bold text-neutral-800 dark:text-neutral-200 text-sm">${escapeHtml(bot.name)}</h4>
            <p class="text-xs text-ios-gray mt-1">${escapeHtml(bot.tagline || 'Ready to chat.')}</p>
          </div>
        `;
      } else {
        container.innerHTML = messages.map(msg => renderMessageHTML(msg, bot)).join('');
      }

      attachCodeCopyEvents();
      scrollToBottom();
      updateSendButtonState();
    }

    function renderMessageHTML(msg, bot) {
      const isUser = msg.role === 'user';
      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (isUser) {
        return `
          <div class="flex flex-col items-end">
            <div class="max-w-[85%] px-3.5 py-2 rounded-2xl rounded-br-sm bg-ios-blue text-white shadow-sm break-words text-sm leading-relaxed">
              ${escapeHtml(msg.content).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[9px] text-ios-gray mt-1 mr-1">${time}</span>
          </div>
        `;
      } else {
        return `
          <div class="flex items-start gap-2.5 max-w-[92%]" id="msg-${msg.id}">
            <div class="w-7 h-7 rounded-full flex-shrink-0 bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center text-xs overflow-hidden mt-0.5 border border-neutral-200 dark:border-neutral-700">
              ${bot.avatar && bot.avatar.startsWith('data:image') ? `<img src="${bot.avatar}" class="w-full h-full object-cover" />` : (bot.avatar || '🤖')}
            </div>
            <div class="flex flex-col items-start min-w-0 flex-1">
              <div class="px-3.5 py-2.5 rounded-2xl rounded-tl-sm bg-ios-lightBubble dark:bg-ios-darkBubble text-neutral-900 dark:text-neutral-100 shadow-sm break-words text-sm leading-relaxed markdown-body w-full">
                ${renderMarkdown(msg.content)}
              </div>
              <span class="text-[9px] text-ios-gray mt-1 ml-1">${time}</span>
            </div>
          </div>
        `;
      }
    }

    /* ==================== API STREAMING ==================== */
    async function handleSendMessage(e) {
      if (e) e.preventDefault();

      if (state.isStreaming) {
        if (activeAbortController) {
          activeAbortController.abort();
          activeAbortController = null;
        }
        return;
      }

      const textarea = document.getElementById('chat-textarea');
      const text = textarea.value.trim();
      if (!text) return;

      const bot = state.bots.find(b => b.id === state.activeBotId);
      if (!bot) return;

      if (!state.settings.apiKey) {
        showToast('Please set your API key in Settings');
        openSettingsModal();
        return;
      }

      const userMessage = {
        id: 'msg-' + Date.now(),
        role: 'user',
        content: text,
        timestamp: Date.now()
      };

      state.chats[bot.id] = state.chats[bot.id] || [];
      state.chats[bot.id].push(userMessage);
      saveChats();

      textarea.value = '';
      textarea.style.height = 'auto';
      renderActiveChat();
      scrollToBottom();

      await streamBotResponse(bot);
    }

    async function streamBotResponse(bot) {
      const container = document.getElementById('chat-messages-container');
      const typingIndicator = document.getElementById('typing-indicator');

      state.isStreaming = true;
      updateSendButtonState();
      show(typingIndicator);
      scrollToBottom();

      const assistantMsgId = 'msg-' + Date.now();
      let assistantContent = '';

      const systemMessage = { role: 'system', content: bot.systemPrompt || `You are ${bot.name}.` };
      const history = (state.chats[bot.id] || []).map(m => ({ role: m.role, content: m.content }));

      activeAbortController = new AbortController();

      try {
        const rawBase = (state.settings.apiBase || 'https://api.openai.com/v1').replace(/\/+$/, '');
        const endpoint = `${rawBase}/chat/completions`;

        const response = await fetch(endpoint, {
          method: 'POST',
          signal: activeAbortController.signal,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.settings.apiKey.trim()}`
          },
          body: JSON.stringify({
            model: bot.model || 'gpt-4o-mini',
            temperature: parseFloat(bot.temperature ?? 0.7),
            messages: [systemMessage, ...history],
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
        }

        hide(typingIndicator);

        const newMsgObj = {
          id: assistantMsgId,
          role: 'assistant',
          content: '',
          timestamp: Date.now()
        };
        state.chats[bot.id].push(newMsgObj);

        const wrapper = document.createElement('div');
        wrapper.innerHTML = renderMessageHTML(newMsgObj, bot);
        const msgElement = wrapper.firstElementChild;
        container.appendChild(msgElement);
        const textContainer = msgElement.querySelector('.markdown-body');

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith(':')) continue;
            if (cleanLine === 'data: [DONE]') break;
            if (cleanLine.startsWith('data: ')) {
              const dataStr = cleanLine.substring(6);
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                const delta = parsed.choices?.[0]?.delta?.content || '';
                if (delta) {
                  assistantContent += delta;
                  newMsgObj.content = assistantContent;
                  textContainer.innerHTML = renderMarkdown(assistantContent);
                  attachCodeCopyEvents(textContainer);
                  scrollIfNearBottom();
                }
              } catch (e) {}
            }
          }
        }
        saveChats();

      } catch (error) {
        hide(typingIndicator);
        if (error.name === 'AbortError') {
          showToast('Stopped generation');
        } else {
          const errorMsg = {
            id: 'err-' + Date.now(),
            role: 'assistant',
            content: `⚠️ **API Error**: ${error.message}\n\nPlease verify your API key in Settings.`,
            timestamp: Date.now()
          };
          state.chats[bot.id].push(errorMsg);
          saveChats();
          renderActiveChat();
        }
      } finally {
        state.isStreaming = false;
        activeAbortController = null;
        updateSendButtonState();
        scrollToBottom();
      }
    }

    function scrollIfNearBottom() {
      const container = document.getElementById('chat-messages-container');
      if (!container) return;
      const threshold = 120;
      const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight <= threshold;
      if (isNearBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    function updateSendButtonState() {
      const textarea = document.getElementById('chat-textarea');
      const sendBtn = document.getElementById('btn-send-message');
      const iconSend = document.getElementById('icon-send');
      const iconStop = document.getElementById('icon-stop');

      if (state.isStreaming) {
        sendBtn.disabled = false;
        sendBtn.classList.remove('bg-ios-blue');
        sendBtn.classList.add('bg-ios-red');
        hide(iconSend);
        show(iconStop);
      } else {
        sendBtn.classList.add('bg-ios-blue');
        sendBtn.classList.remove('bg-ios-red');
        show(iconSend);
        hide(iconStop);
        sendBtn.disabled = textarea.value.trim().length === 0;
      }
    }

    /* ==================== MARKDOWN FORMATTER ==================== */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMarkdown(rawText) {
      if (!rawText) return '';

      const codeBlocks = [];
      let text = rawText.replace(/```([a-zA-Z0-9_\-+]*)\n([\s\S]*?)```/g, (m, lang, code) => {
        const id = `___CODE_BLOCK_${codeBlocks.length}___`;
        codeBlocks.push({ lang: lang.trim(), code });
        return id;
      });

      text = escapeHtml(text);

      text = text.replace(/^>(.*)$/gm, '<blockquote class="border-l-2 border-ios-blue pl-2.5 my-1 text-neutral-500 dark:text-neutral-400 italic">$1</blockquote>');
      text = text.replace(/^\s*[\-\*]\s+(.*)$/gm, '<li class="ml-4 list-disc">$1</li>');
      text = text.replace(/^\s*(\d+)\.\s+(.*)$/gm, '<li class="ml-4 list-decimal">$2</li>');
      text = text.replace(/`([^`]+)`/g, '<code class="bg-neutral-200/80 dark:bg-neutral-800 text-ios-blue dark:text-blue-400 px-1 py-0.5 rounded text-xs font-mono">$1</code>');
      text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      text = text.replace(/\n/g, '<br/>');

      codeBlocks.forEach((item, index) => {
        const escapedCode = escapeHtml(item.code.trim());
        const langLabel = item.lang || 'code';
        const blockHtml = `
          <div class="my-2 rounded-xl overflow-hidden bg-neutral-900 border border-neutral-700/80 text-neutral-100 shadow-md">
            <div class="flex items-center justify-between px-3 py-1 bg-neutral-950/80 border-b border-neutral-800 text-[10px] font-mono text-neutral-400">
              <span>${escapeHtml(langLabel)}</span>
              <button type="button" class="btn-copy-code px-2 py-0.5 rounded hover:bg-neutral-800 active:scale-95 transition-all text-[10px] text-neutral-300 hover:text-white cursor-pointer" data-code="${encodeURIComponent(item.code)}">Copy</button>
            </div>
            <pre class="p-3 overflow-x-auto text-xs font-mono leading-relaxed text-neutral-200"><code>${escapedCode}</code></pre>
          </div>
        `;
        text = text.replace(`___CODE_BLOCK_${index}___`, blockHtml);
      });

      return text;
    }

    function attachCodeCopyEvents(scope = document) {
      scope.querySelectorAll('.btn-copy-code').forEach(btn => {
        if (btn._hasCopyListener) return;
        btn._hasCopyListener = true;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const code = decodeURIComponent(btn.getAttribute('data-code') || '');
          navigator.clipboard.writeText(code).then(() => {
            const orig = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => btn.textContent = orig, 1800);
          }).catch(() => showToast('Failed to copy'));
        });
      });
    }

    /* ==================== BOT EDITOR MODAL ==================== */
    function openBotEditor(botIdToEdit = null) {
      state.editingBotId = botIdToEdit;
      const title = document.getElementById('modal-bot-title');
      const deleteBtnContainer = document.getElementById('delete-bot-action-container');

      const nameInput = document.getElementById('bot-name-input');
      const taglineInput = document.getElementById('bot-tagline-input');
      const promptInput = document.getElementById('bot-prompt-input');
      const modelInput = document.getElementById('bot-model-input');
      const tempSlider = document.getElementById('bot-temp-slider');
      const tempDisplay = document.getElementById('temp-val-display');

      if (botIdToEdit) {
        const bot = state.bots.find(b => b.id === botIdToEdit);
        if (!bot) return;

        title.textContent = 'Edit Character';
        nameInput.value = bot.name || '';
        taglineInput.value = bot.tagline || '';
        promptInput.value = bot.systemPrompt || '';
        modelInput.value = bot.model || 'gpt-4o-mini';
        tempSlider.value = bot.temperature ?? 0.7;
        tempDisplay.textContent = Number(tempSlider.value).toFixed(1);

        state.tempAvatar = bot.avatar || '🤖';
        renderAvatarPreview(bot.avatar);
        show(deleteBtnContainer);
      } else {
        title.textContent = 'New Character';
        nameInput.value = '';
        taglineInput.value = '';
        promptInput.value = '';
        modelInput.value = 'gpt-4o-mini';
        tempSlider.value = 0.7;
        tempDisplay.textContent = '0.7';

        state.tempAvatar = '🤖';
        renderAvatarPreview('🤖');
        hide(deleteBtnContainer);
      }

      show('modal-bot-editor');
    }

    function closeBotEditor() {
      hide('modal-bot-editor');
      state.editingBotId = null;
    }

    function renderAvatarPreview(avatar) {
      const container = document.getElementById('bot-avatar-preview');
      if (avatar && avatar.startsWith('data:image')) {
        container.innerHTML = `<img src="${avatar}" class="w-full h-full object-cover" />`;
      } else {
        container.innerHTML = `<span>${avatar || '🤖'}</span>`;
      }
    }

    function saveBotFromEditor() {
      const name = document.getElementById('bot-name-input').value.trim();
      const tagline = document.getElementById('bot-tagline-input').value.trim();
      const systemPrompt = document.getElementById('bot-prompt-input').value.trim();
      const model = document.getElementById('bot-model-input').value.trim() || 'gpt-4o-mini';
      const temperature = parseFloat(document.getElementById('bot-temp-slider').value);

      if (!name) {
        showToast('Please enter a character name');
        return;
      }

      if (state.editingBotId) {
        const idx = state.bots.findIndex(b => b.id === state.editingBotId);
        if (idx !== -1) {
          state.bots[idx] = {
            ...state.bots[idx],
            name,
            tagline,
            systemPrompt,
            model,
            temperature,
            avatar: state.tempAvatar || state.bots[idx].avatar || '🤖'
          };
          showToast('Character updated');
        }
      } else {
        const newBot = {
          id: 'bot-' + Date.now(),
          name,
          tagline,
          systemPrompt,
          model,
          temperature,
          avatar: state.tempAvatar || '🤖',
          createdAt: Date.now()
        };
        state.bots.unshift(newBot);
        showToast('Character created');
      }

      saveBots();
      closeBotEditor();
      renderBotList();
      if (state.activeBotId) renderActiveChat();
    }

    function deleteCurrentBot() {
      if (!state.editingBotId) return;
      if (!confirm('Are you sure you want to delete this character?')) return;

      const id = state.editingBotId;
      state.bots = state.bots.filter(b => b.id !== id);
      delete state.chats[id];

      saveBots();
      saveChats();
      closeBotEditor();
      switchView('list');
      showToast('Character deleted');
    }

    function processImageUpload(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Please select an image file');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 180;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minDim = Math.min(img.width, img.height);
          const startX = (img.width - minDim) / 2;
          const startY = (img.height - minDim) / 2;

          ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, size, size);
          const compressed = canvas.toDataURL('image/jpeg', 0.85);
          state.tempAvatar = compressed;
          renderAvatarPreview(compressed);
          showToast('Photo uploaded');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ==================== SETTINGS & BACKUP ==================== */
    function openSettingsModal() {
      document.getElementById('input-api-key').value = state.settings.apiKey || '';
      document.getElementById('input-api-base').value = state.settings.apiBase || 'https://api.openai.com/v1';
      show('modal-settings');
    }

    function closeSettingsModal() {
      state.settings.apiKey = document.getElementById('input-api-key').value.trim();
      state.settings.apiBase = document.getElementById('input-api-base').value.trim() || 'https://api.openai.com/v1';
      saveSettings();
      hide('modal-settings');
      showToast('Settings saved');
    }

    function exportBackup() {
      const data = {
        version: 4,
        exportDate: new Date().toISOString(),
        settings: { ...state.settings, apiKey: '' },
        bots: state.bots,
        chats: state.chats
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `personas-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded');
    }

    function importBackup(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data.bots)) {
            state.bots = data.bots;
            saveBots();
          }
          if (data.chats && typeof data.chats === 'object') {
            state.chats = data.chats;
            saveChats();
          }
          renderBotList();
          showToast('Backup imported');
          hide('modal-settings');
        } catch (err) {
          showToast('Invalid backup file');
        }
      };
      reader.readAsText(file);
    }

    /* ==================== TOAST ==================== */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2300);
    }

    /* ==================== EVENT LISTENERS ==================== */
    function setupEventListeners() {
      // Header Buttons
      document.getElementById('btn-toggle-theme').onclick = toggleTheme;
      document.getElementById('btn-open-settings').onclick = openSettingsModal;
      document.getElementById('btn-close-settings').onclick = closeSettingsModal;
      document.getElementById('btn-create-bot').onclick = () => openBotEditor();
      document.getElementById('btn-chat-back').onclick = () => switchView('list');

      // Bot List Card Click (Event Delegation)
      document.getElementById('bot-list-container').onclick = (e) => {
        const card = e.target.closest('.bot-card');
        if (card) {
          const botId = card.getAttribute('data-id');
          openBotChat(botId);
        }
      };

      // Search Filtering
      document.getElementById('input-search-bots').oninput = (e) => {
        renderBotList(e.target.value);
      };

      // Chat Form & Input
      const textarea = document.getElementById('chat-textarea');
      document.getElementById('chat-form').onsubmit = handleSendMessage;
      
      // Improved auto-resize logic
      textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        // Constrain max height
        const newHeight = Math.min(this.scrollHeight, 128);
        this.style.height = newHeight + 'px';
        updateSendButtonState();
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      // Temperature Slider
      const tempSlider = document.getElementById('bot-temp-slider');
      tempSlider.oninput = (e) => {
        document.getElementById('temp-val-display').textContent = Number(e.target.value).toFixed(1);
      };

      // Bot Modal Actions
      document.getElementById('btn-cancel-bot-edit').onclick = closeBotEditor;
      document.getElementById('btn-save-bot').onclick = saveBotFromEditor;
      document.getElementById('btn-delete-bot').onclick = deleteCurrentBot;

      // Photo and Emoji Picker
      const fileInput = document.getElementById('bot-avatar-file-input');
      const pickPhoto = () => fileInput.click();
      document.getElementById('avatar-picker-trigger').onclick = pickPhoto;
      document.getElementById('btn-choose-photo').onclick = pickPhoto;
      fileInput.onchange = (e) => {
        if (e.target.files && e.target.files[0]) processImageUpload(e.target.files[0]);
      };

      document.getElementById('btn-pick-emoji').onclick = () => {
        const emoji = prompt('Enter an emoji icon:', state.tempAvatar || '🤖');
        if (emoji && emoji.trim()) {
          state.tempAvatar = emoji.trim();
          renderAvatarPreview(state.tempAvatar);
        }
      };

      // Quick Archetype Buttons - Fixed
      const archetypeButtons = document.querySelectorAll('.btn-quick-archetype');
      archetypeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          // Set inputs
          document.getElementById('bot-name-input').value = btn.dataset.name;
          document.getElementById('bot-tagline-input').value = btn.dataset.tagline;
          document.getElementById('bot-prompt-input').value = btn.dataset.prompt;
          
          // Set slider value and trigger the display update manually
          const tempVal = Number(btn.dataset.temp);
          document.getElementById('bot-temp-slider').value = tempVal;
          document.getElementById('temp-val-display').textContent = tempVal.toFixed(1);

          state.tempAvatar = btn.dataset.avatar || '🤖';
          renderAvatarPreview(state.tempAvatar);
        });
      });

      // Chat Dropdown Menu
      const menuBtn = document.getElementById('btn-chat-options');
      const dropdown = document.getElementById('chat-dropdown-menu');
      
      menuBtn.onclick = (e) => {
        e.stopPropagation();
        if (dropdown.classList.contains('app-hidden')) {
          show(dropdown);
        } else {
          hide(dropdown);
        }
      };

      document.addEventListener('click', () => hide(dropdown));

      document.getElementById('menu-edit-bot').onclick = () => {
        hide(dropdown);
        openBotEditor(state.activeBotId);
      };

      document.getElementById('btn-chat-header-info').onclick = () => {
        openBotEditor(state.activeBotId);
      };

      document.getElementById('menu-clear-chat').onclick = () => {
        hide(dropdown);
        if (state.activeBotId && confirm('Clear this conversation history?')) {
          state.chats[state.activeBotId] = [];
          saveChats();
          renderActiveChat();
          showToast('History cleared');
        }
      };

      // Settings Key Eye Toggle
      document.getElementById('btn-toggle-key-visibility').onclick = () => {
        const input = document.getElementById('input-api-key');
        input.type = input.type === 'password' ? 'text' : 'password';
      };

      // Backup Handlers
      document.getElementById('btn-export-backup').onclick = exportBackup;
      const importInput = document.getElementById('input-import-backup');
      document.getElementById('btn-import-backup-trigger').onclick = () => importInput.click();
      importInput.onchange = (e) => {
        if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
      };

      // Reset All Data
      document.getElementById('btn-reset-all-data').onclick = () => {
        if (confirm('Factory reset? This will erase all personas and chat records.')) {
          localStorage.removeItem(STORAGE_KEY_BOTS);
          localStorage.removeItem(STORAGE_KEY_CHATS);
          localStorage.removeItem(STORAGE_KEY_SETTINGS);
          location.reload();
        }
      };

      // Backdrop dismissal for modals
      document.getElementById('modal-bot-editor').onclick = (e) => {
        if (e.target === document.getElementById('modal-bot-editor')) closeBotEditor();
      };
      document.getElementById('modal-settings').onclick = (e) => {
        if (e.target === document.getElementById('modal-settings')) closeSettingsModal();
      };

      // ESC key handler
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeBotEditor();
          closeSettingsModal();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
