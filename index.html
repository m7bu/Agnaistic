<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Personas" />
  <meta id="meta-theme-color" name="theme-color" content="#000000" />
  <title>AI Personas Studio</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              gray: '#8E8E93',
              lightBg: '#F2F2F7',
              lightCard: '#FFFFFF',
              lightBubble: '#E9E9EB',
              darkBg: '#000000',
              darkCard: '#1C1C1E',
              darkBubble: '#2C2C2E',
              darkBorder: '#2C2C2E',
              lightBorder: '#E5E5EA'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Helvetica Neue', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="manifest" id="manifest-placeholder" />

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top { padding-top: max(14px, var(--sat)); }
    .safe-bottom { padding-bottom: max(14px, var(--sab)); }

    /* Utility classes for state toggling */
    .app-hidden {
      display: none !important;
    }
    .app-flex {
      display: flex !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(142, 142, 147, 0.5); }

    /* Typing pulse */
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
      40% { transform: scale(1.05); opacity: 1; }
    }
    .dot-1 { animation: dotPulse 1.3s infinite ease-in-out; }
    .dot-2 { animation: dotPulse 1.3s infinite ease-in-out 0.2s; }
    .dot-3 { animation: dotPulse 1.3s infinite ease-in-out 0.4s; }

    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Code block styles */
    .code-block-container pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.875rem;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      background: #2d2d2d;
      padding: 0.5rem 1rem;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
      font-size: 0.75rem;
      color: #ccc;
    }
  </style>
</head>
<body class="h-full bg-ios-lightBg dark:bg-ios-darkBg text-neutral-900 dark:text-neutral-100 font-sans antialiased overflow-hidden transition-colors duration-200">

  <!-- ==================== MAIN APP CONTAINER ==================== -->
  <div id="app" class="h-[100dvh] flex flex-col w-full max-w-lg mx-auto relative overflow-hidden bg-ios-lightBg dark:bg-ios-darkBg sm:border-x sm:border-ios-lightBorder sm:dark:border-ios-darkBorder shadow-2xl">
    
    <!-- ==================== VIEW 1: BOT DIRECTORY ==================== -->
    <section id="view-bots" class="flex-1 flex flex-col h-full w-full overflow-hidden">
      <!-- Navbar -->
      <header class="safe-top px-4 pb-3 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/90 dark:bg-ios-darkBg/90 backdrop-blur-xl z-10 sticky top-0">
        <div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-ios-blue">Studio</span>
          <h1 class="text-2xl font-black tracking-tight">Characters</h1>
        </div>
        
        <div class="flex items-center gap-2">
          <!-- Theme Toggle -->
          <button type="button" id="btn-toggle-theme" aria-label="Toggle Theme" class="p-2.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <span id="theme-icon-sun" class="app-hidden text-sm leading-none">☀️</span>
            <span id="theme-icon-moon" class="text-sm leading-none">🌙</span>
          </button>

          <!-- Settings -->
          <button type="button" id="btn-open-settings" aria-label="Settings" class="p-2.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 active:scale-90 transition-transform cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>

          <!-- Create Button -->
          <button type="button" id="btn-create-bot" class="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-ios-blue text-white text-xs font-bold active:scale-95 transition-transform shadow-sm cursor-pointer">
            <svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span>New</span>
          </button>
        </div>
      </header>

      <!-- Search Bar -->
      <div class="px-4 py-2.5">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 absolute left-3.5 text-ios-gray pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="input-search-bots" placeholder="Search characters..." class="w-full bg-neutral-200/70 dark:bg-neutral-800/70 text-sm placeholder-ios-gray rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-ios-blue transition-all" />
        </div>
      </div>

      <!-- Character List -->
      <main id="bot-list-container" class="flex-1 overflow-y-auto px-4 py-2 space-y-2.5 pb-24">
        <!-- Rendered by JavaScript -->
      </main>
    </section>

    <!-- ==================== VIEW 2: CHAT INTERFACE ==================== -->
    <section id="view-chat" class="app-hidden flex-1 flex flex-col h-full w-full overflow-hidden bg-white dark:bg-black">
      <!-- Chat Navbar -->
      <header class="safe-top px-3 pb-2.5 flex items-center justify-between border-b border-ios-lightBorder dark:border-ios-darkBorder bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl z-20">
        <button type="button" id="btn-chat-back" class="flex items-center text-ios-blue font-semibold active:opacity-50 transition-opacity pr-2 py-1 cursor-pointer">
          <svg class="w-5 h-5 -ml-1 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-xs font-bold">Back</span>
        </button>

        <!-- Bot Identity -->
        <div class="flex items-center gap-2 max-w-[55%] truncate cursor-pointer select-none" id="btn-chat-header-info">
          <div id="chat-header-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-neutral-200 dark:bg-neutral-800 flex-shrink-0 flex items-center justify-center font-bold text-xs text-white"></div>
          <div class="truncate text-left">
            <h2 id="chat-header-name" class="text-xs font-bold truncate leading-tight">Bot</h2>
            <p id="chat-header-model" class="text-[10px] text-ios-gray truncate font-mono">gpt-4o-mini</p>
          </div>
        </div>

        <!-- Chat Options -->
        <div class="relative">
          <button type="button" id="btn-chat-options" aria-label="Menu" class="p-1.5 text-ios-blue active:opacity-50 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
            </svg>
          </button>
          
          <div id="chat-dropdown-menu" class="app-hidden absolute right-0 mt-1.5 w-44 rounded-2xl bg-white/95 dark:bg-neutral-900/95 backdrop-blur-xl shadow-2xl border border-neutral-200 dark:border-neutral-800 py-1 z-50 text-xs">
            <button type="button" id="menu-edit-bot" class="w-full text-left px-3.5 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 flex items-center gap-2 cursor-pointer font-medium">
              <span>✏️ Edit Persona</span>
            </button>
            <button type="button" id="menu-clear-chat" class="w-full text-left px-3.5 py-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-ios-red flex items-center gap-2 border-t border-neutral-100 dark:border-neutral-800 cursor-pointer font-medium">
              <span>🗑️ Clear History</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Messages Stream -->
      <main id="chat-messages-container" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 select-text">
        <!-- Injected dynamically -->
      </main>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="app-hidden px-4 py-1.5 flex items-center gap-2 text-xs text-ios-gray">
        <div class="px-3 py-2 rounded-2xl bg-ios-lightBubble dark:bg-ios-darkBubble inline-flex items-center gap-1 shadow-sm">
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-1"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-2"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-ios-gray dot-3"></span>
        </div>
      </div>

      <!-- Bottom Chat Composer -->
      <footer class="safe-bottom p-2.5 bg-ios-lightBg/95 dark:bg-ios-darkBg/95 backdrop-blur-xl border-t border-ios-lightBorder dark:border-ios-darkBorder z-20">
        <form id="chat-form" class="flex items-end gap-2 max-w-full">
          <div class="flex-1 bg-white dark:bg-neutral-900 border border-ios-lightBorder dark:border-ios-darkBorder rounded-2xl flex items-center px-3.5 py-1.5 focus-within:ring-2 focus-within:ring-ios-blue transition-all">
            <textarea id="chat-textarea" rows="1" placeholder="Type a message..." class="w-full bg-transparent text-sm resize-none focus:outline-none max-h-32 leading-5 text-neutral-900 dark:text-neutral-100 placeholder-ios-gray"></textarea>
          </div>
          
          <button type="submit" id="btn-send-message" disabled class="p-2.5 rounded-full bg-ios-blue text-white disabled:opacity-40 disabled:pointer-events-none active:scale-95 transition-all flex-shrink-0 cursor-pointer shadow-md">
            <svg id="icon-send" class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            <svg id="icon-stop" class="w-4 h-4 app-hidden fill-current" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- ==================== MODAL: PERSONA EDITOR ==================== -->
    <div id="modal-bot-editor" class="app-hidden fixed inset-0 z-50 items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-lg bg-ios-lightBg dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
        
        <div class="px-4 py-3 border-b border-ios-lightBorder dark:border-ios-darkBorder flex items-center justify-between bg-white dark:bg-neutral-900 sticky top-0 z-10">
          <button type="button" id="btn-cancel-bot-edit" class="text-xs font-semibold text-ios-blue cursor-pointer py-1 px-2">Cancel</button>
          <h3 id="modal-bot-title" class="text-sm font-bold">New Character</h3>
          <button type="button" id="btn-save-bot" class="text-xs font-bold text-ios-blue cursor-pointer py-1 px-2">Save</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Avatar Customization -->
          <div class="flex flex-col items-center justify-center py-1">
            <input type="file" id="bot-avatar-file-input" accept="image/*" class="hidden" />
            <div class="relative cursor-pointer group" id="avatar-picker-trigger" title="Upload custom photo">
              <div id="bot-avatar-preview" class="w-16 h-16 rounded-full bg-gradient-to-tr from-ios-blue to-purple-600 text-white flex items-center justify-center font-bold text-2xl shadow-md overflow-hidden ring-4 ring-white dark:ring-neutral-800">
                <span>🤖</span>
              </div>
              <div class="absolute bottom-0 right-0 bg-neutral-900 text-white rounded-full p-1 shadow-md border border-white dark:border-neutral-700">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              </div>
            </div>
            <div class="flex items-center gap-2 mt-2">
              <button type="button" id="btn-choose-photo" class="text-[11px] text-ios-blue font-bold cursor-pointer">Choose Photo</button>
              <span class="text-ios-gray text-xs">•</span>
              <button type="button" id="btn-pick-emoji" class="text-[11px] text-ios-blue font-bold cursor-pointer">Set Emoji</button>
            </div>
          </div>

          <!-- Name & Tagline Inputs -->
          <div class="bg-white dark:bg-neutral-800 rounded-2xl overflow-hidden border border-neutral-200 dark:border-neutral-700 divide-y divide-neutral-100 dark:divide-neutral-700">
            <div class="p-3">
              <label class="block text-[10px] font-bold text-ios-gray uppercase tracking-wider mb-1">Character
